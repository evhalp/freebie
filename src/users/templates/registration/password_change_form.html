{% extends "base.html" %}
{% block content %}
    <h2>Change Your Password!</h2>
    <form method="post" class="password-change-form">
        {% csrf_token %}
        <div>
        <label for="id_old_password"><span style="color: red">*</span>Password:</label>
        {{ form.old_password }}
        </div>

        <div>
        <label for="id_new_password1"><span style="color: red">*</span>New Password:</label>
        {{ form.new_password1 }}
        </div>

        <div>
        <label for="id_new_password2"><span style="color: red">*</span>Confirm New Password:</label>
        {{ form.new_password2 }}
        </div>

        <input type="submit" value="Change Password">
    </form>
    <a href="{% url 'dashboard' %}">Return to Dashboard</a>

<script>
    document.addEventListener("DOMContentLoaded", () => {
    const oldPassword = document.getElementById("id_old_password");
    const newPassword1 = document.getElementById("id_new_password1");
    const newPassword2 = document.getElementById("id_new_password2");

    if (oldPassword) oldPassword.placeholder = "Enter your old password";
    if (newPassword1) newPassword1.placeholder = "Enter your new password";
    if (newPassword2) newPassword2.placeholder = "Re-type your new password";
});
</script>
{% endblock content %}
